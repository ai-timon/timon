# Asks the author of a pull request to sign CLA.md once, by a comment.
# Signatures are stored in this repository, on the `cla-signatures` branch.
# ai-timon-admin is the account of the rights holder: it has nothing to sign.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

# Every run commits to signatures/cla.json on the same branch: two runs at
# once race, and one of the two signatures is lost. Runs wait in the group
# instead of being cancelled, and `queue: max` keeps them in order: none is
# dropped while fewer than 100 are pending.
concurrency:
  group: cla-signatures
  queue: max
  cancel-in-progress: false

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    steps:
      - name: Check or record the signature
        # Never checks out the pull request's code: it only reads comments.
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/ai-timon/timon/blob/main/CLA.md
          branch: cla-signatures
          allowlist: ai-timon-admin,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request. Before we can merge it, please read the
            [Contributor Licence Agreement](https://github.com/ai-timon/timon/blob/main/CLA.md)
            and sign it by posting the comment below. You only do this once.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
          lock-pullrequest-aftermerge: false
