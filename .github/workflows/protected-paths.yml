# Fails a pull request from outside the project that changes a protected path:
# licences, governance files, the keys and addresses Timon trusts, the brand,
# the identity of the packages (.github/protected-paths).
#
# pull_request_target runs this workflow, the script and the list as they are
# on main, never as the pull request would have them. The pull request's code
# is never checked out nor run: its files are read through the GitHub API.
#
# A maintainer accepts a protected change with the label
# protected-paths-approved; a new push withdraws it (hence the write access to
# pull requests, used for that label only).
name: Protected paths

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  protected-paths:
    name: protected paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default ref of pull_request_target is the base branch: main.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          EVENT_ACTION: ${{ github.event.action }}
        run: node scripts/check-protected-paths.mjs
